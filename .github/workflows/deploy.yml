name: Deploy to GitHub Pages

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://traffic-based-route-guidance-system.onrender.com

      - name: Create GitHub Pages routing files
        run: |
          # Create .nojekyll to prevent Jekyll processing
          touch docs/.nojekyll
          
          # Create 404.html for client-side routing on GitHub Pages
          cat > docs/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Traffic-Based Route Guidance System</title>
              <script>
                var segmentCount = 0;
                var l = window.location;
                l.replace(
                  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                  '/Traffic-based-Route-Guidance-System/?p=' +
                  l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
                  (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                  l.hash
                );
              </script>
            </head>
            <body>
            </body>
          </html>
          EOF

      - name: Check if docs folder was created
        run: |
          if [ -d "docs" ]; then
            echo "✓ Build successful - docs folder created"
            echo "Index.html exists: $([ -f docs/index.html ] && echo 'YES' || echo 'NO')"
            echo "Checking assets:"
            ls -la docs/assets/ 2>/dev/null || echo "No assets folder"
          else
            echo "✗ Build failed - docs folder not found"
            exit 1
          fi

      - name: Commit and push built files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f docs/
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "chore: deploy frontend build to GitHub Pages"
            git push -u origin deploy --force
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: deploy
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
